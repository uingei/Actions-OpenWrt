name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        ls -la ~
        sudo ls -la /home/linuxbrew* /usr/share/miniconda*
        sudo du -hs /home/linuxbrew/.linuxbrew/* /usr/share/miniconda/*

        echo "[1/6] 获取当前安装的包列表（记录初始状态）..."
        dpkg-query -W -f='${Package}\n' | sort > current-packages.txt

        echo "[2/6] 写入 EFI 系统必要软件包列表..."
        cat > efi-essential.txt <<EOF
        grub-efi-amd64-signed
        shim-signed
        grub2-common
        efibootmgr
        initramfs-tools
        linux-image-generic
        linux-image-azure
        linux-headers-generic
        linux-headers-azure
        linux-tools-azure
        linux-cloud-tools-azure
        linux-base
        linux-azure
        linux-libc-dev
        systemd-sysv
        udev
        libsystemd0
        init
        util-linux
        base-files
        login
        passwd
        bash
        coreutils
        os-prober
        mokutil
        sbsigntool
        netplan.io
        openssh-server
        walinuxagent
        EOF

        echo "[2.1] 动态添加当前内核相关包（避免误删运行内核）..."
        KERNEL_VER="$(uname -r)"
        echo "linux-image-$KERNEL_VER" > kernel-package.txt
        echo "linux-modules-$KERNEL_VER" >> kernel-package.txt
        echo "linux-headers-$KERNEL_VER" >> kernel-package.txt
        echo "linux-tools-$KERNEL_VER" >> kernel-package.txt
        echo "linux-cloud-tools-$KERNEL_VER" >> kernel-package.txt

        echo "[3/6] 合并保留白名单..."
        cat minimal-packages.txt efi-essential.txt kernel-package.txt | sort -u > full-minimal-efi.txt

        echo "[4/6] 计算非白名单额外包..."
        comm -23 current-packages.txt full-minimal-efi.txt > extra-packages.raw.txt

        #echo "[5/6] 过滤 Essential/held/关键依赖（如 libc6 等）..."
        #egrep -v '^(init|systemd|dpkg|apt|libc6|perl-base|coreutils|bash|login|util-linux|base-files|libpam|libselinux|libcrypt|libsystemd|libudev|libmount|libtinfo|debconf|shim-signed|grub2-common|mokutil|grub-efi|linux-image|initramfs|efibootmgr|os-prober)' \
        #  extra-packages.raw.txt > extra-packages.safe.txt

        #echo "[准备] 修复依赖 & 安装必要包..."
        #sudo -E apt-get update -qq
        #sudo -E apt-get install -f -y -qq || true
        #sudo -E apt-get install -y -qq grub-efi-amd64-signed grub2-common mokutil

        echo "[6/6] 使用 apt-get 非交互方式清理多余软件包..."
        while read -r pkg; do
          sudo -E apt-get -y -qq purge "$pkg" > /dev/null 2>&1 || echo "[跳过失败] $pkg"
        done < extra-packages.raw.txt

        echo "[Done] 可选清理命令：sudo apt-get autoremove --purge -y && sudo apt-get clean"
        sudo -E apt-get autoremove --purge -y -qq
        sudo -E apt-get clean

        echo "[信息] 保存最终当前包列表..."
        dpkg-query -W -f='${Package}\n' | sort > new-current-packages.txt

        echo "[对比] 生成已删除包列表..."
        comm -23 current-packages.txt new-current-packages.txt > removed-packages.txt

        du -hs /opt/hostedtoolcache/*

        which cargo && cargo --version || echo "Rust 未安装或被破坏"
        which node && node -v || echo "Node.js 未安装或被破坏"

    - name: Upload package comparison results
      uses: actions/upload-artifact@v4
      with:
        name: package-cleanup-results
        path: |
          current-packages.txt
          kernel-package.txt
          new-current-packages.txt
          removed-packages.txt
