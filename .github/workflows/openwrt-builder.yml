name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  FALLBACK_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        sudo docker image prune --all --force

        # Clean unnecessary packages and directories
        dpkg-query -W -f='${Package}\n' | sort > current-packages.txt
        KERNEL_VER="$(uname -r)"
        grep "$KERNEL_VER" current-packages.txt > kernel-package.txt
        cat minimal-packages.txt kernel-package.txt | sort -u > minimal-packages.full.txt
        comm -23 current-packages.txt minimal-packages.full.txt | \
          grep -vE '^(google-chrome-stable|google-cloud-cli-anthoscli|postgresql-common-dev|temurin-[0-9]+-jdk)$' \
          > extra-packages.final.txt
        sudo -E apt-get purge -y -qq $(< extra-packages.final.txt)

        sudo mv /etc/apt/sources.list.d/ubuntu.sources /tmp
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/{PyPy,Python,Ruby,go} \
          /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
        sudo mv /tmp/ubuntu.sources /etc/apt/sources.list.d

        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget \
          curl jq
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        echo "Cloning ${REPO_URL} (branch ${REPO_BRANCH})..."
        if git clone -b "${REPO_BRANCH}" "${REPO_URL}" openwrt; then
          echo "Cloned from primary repository."
        else
          echo "Primary clone failed, trying fallback: ${FALLBACK_URL}..."
          git clone -b "${REPO_BRANCH}" "${FALLBACK_URL}" openwrt || {
            echo "::error ::Failed to clone both repositories."
            exit 1
          }
          if [ -f "openwrt/${FEEDS_CONF}" ]; then
            sed -i \
              -e 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' \
              -e 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' \
              "openwrt/${FEEDS_CONF}"
          fi
        fi
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Setup dl cache
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: dl-cache

    - name: Setup build_dir cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/build_dir/host
          openwrt/build_dir/toolchain*
        key: build_dir-cache

    - name: Setup staging_dir cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/hostpkg
          openwrt/staging_dir/target*
          openwrt/staging_dir/toolchain*
        key: staging_dir-cache

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        git config --global user.email "noreply@github.com"
        git config --global user.name "GitHub Actions"
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt && ./scripts/feeds update -a

        version_gte() {
          # Returns 0 if $1 >= $2 (version comparison)
          printf '%s\n%s\n' "$2" "$1" | sort -V -C
        }

        # Update package version and hash function
        update_pkg() {
          local pkg=$1
          local repo=$2
          local makefile="feeds/packages/net/$pkg/Makefile"
          local version_head="PKG_VERSION:="
          local hash_head="PKG_HASH:="
          local api_url="https://api.github.com/repos/$repo/releases"
          local download_url="https://codeload.github.com/$repo/tar.gz/v"

          old_version=$(sed -n "/^$version_head/p" "$makefile" | awk -F '=' '{print $2}')
          new_version=$(curl -sL "$api_url" | jq -r 'map(select(.prerelease|not)) | first | .tag_name' | sed 's/.*v//')

          if [[ -z "$new_version" ]]; then
            echo "::error ::Failed to fetch new version for $pkg from $repo"
            exit 1
          fi

          echo "$pkg current version: $old_version"
          echo "$pkg latest version: $new_version"

          if version_gte "$old_version" "$new_version"; then
            echo "$pkg is up-to-date ($old_version), no update needed."
          else
            pkg_hash=$(wget -qO - "${download_url}${new_version}" | sha256sum | awk '{print $1}')
            if [[ -z "$pkg_hash" ]]; then
              echo "::error ::Failed to calculate hash for $pkg version $new_version"
              exit 1
            fi
            sed -i -e "/^$version_head/c$version_head$new_version" -e "/^$hash_head/c$hash_head$pkg_hash" "$makefile"
            echo "Updated $pkg version to $new_version"
          fi
        }

        update_pkg "sing-box" "SagerNet/sing-box"
        update_pkg "xray-core" "XTLS/Xray-core"

        git clone --branch openwrt-23.05 --depth 1 https://github.com/openwrt/packages.git tmp_oldpackages || exit 1
        if [ -d tmp_oldpackages/net/shadowsocks-libev ] && [ ! -d feeds/packages/net/shadowsocks-libev ]; then
          mv tmp_oldpackages/net/shadowsocks-libev feeds/packages/net
        fi

        git clone --branch master --depth 1 https://github.com/openwrt/packages.git tmp_newpackages || exit 1
        if [ -d tmp_newpackages/lang/golang ] && [ -d feeds/packages/lang/golang ]; then
          rm -rf feeds/packages/lang/golang && mv tmp_newpackages/lang/golang feeds/packages/lang
        fi

        git clone --branch "${REPO_BRANCH}" --depth 1 https://github.com/immortalwrt/packages.git tmp_packages || exit 1
        git clone --branch "${REPO_BRANCH}" --depth 1 https://github.com/immortalwrt/luci.git tmp_luci || exit 1

        #[ ! -d feeds/luci/applications/luci-app-adguardhome ] && \
        #  git clone --branch master --depth 1 https://github.com/kongfl888/luci-app-adguardhome.git feeds/luci/applications/luci-app-adguardhome || exit 1

        #if [ -d tmp_packages/net/gost ] && [ ! -d feeds/packages/net/gost ]; then
        #  mv tmp_packages/net/gost feeds/packages/net
        #fi
        #if [ -d tmp_luci/applications/luci-app-gost ] && [ ! -d feeds/luci/applications/luci-app-gost ]; then
        #  mv tmp_luci/applications/luci-app-gost feeds/luci/applications
        #fi

        [ ! -d feeds/luci/applications/luci-app-homeproxy ] && \
          git clone --branch master --depth 1 https://github.com/immortalwrt/homeproxy.git feeds/luci/applications/luci-app-homeproxy || exit 1

        [ -d feeds/packages/net/smartdns ] && rm -rf feeds/packages/net/smartdns && \
          git clone --branch master --depth 1 https://github.com/pymumu/openwrt-smartdns.git feeds/packages/net/smartdns || exit 1
        New_PKG_SOURCE_VERSION=$(git ls-remote https://github.com/pymumu/smartdns.git master | awk '{ print $1; }')
        New_SMARTDNS_WEBUI_SOURCE_VERSION=$(git ls-remote https://github.com/pymumu/smartdns-webui.git main | awk '{ print $1; }')
        echo "smartdns PKG_SOURCE_VERSION: $New_PKG_SOURCE_VERSION"
        echo "smartdns-webui SOURCE_VERSION: $New_SMARTDNS_WEBUI_SOURCE_VERSION"
        sed -i -e "/^PKG_SOURCE_VERSION:=/cPKG_SOURCE_VERSION:=$New_PKG_SOURCE_VERSION" \
          -e "/^SMARTDNS_WEBUI_SOURCE_VERSION:=/cSMARTDNS_WEBUI_SOURCE_VERSION:=$New_SMARTDNS_WEBUI_SOURCE_VERSION" \
          feeds/packages/net/smartdns/Makefile
        [ -d feeds/luci/applications/luci-app-smartdns ] && rm -rf feeds/luci/applications/luci-app-smartdns && \
          git clone --branch master --depth 1 https://github.com/pymumu/luci-app-smartdns.git feeds/luci/applications/luci-app-smartdns || exit 1

        if [ -d tmp_packages/net/mosdns ] && [ ! -d feeds/packages/net/mosdns ]; then
          mv tmp_packages/net/mosdns feeds/packages/net
        fi

        if [ -d tmp_luci/applications/luci-app-syncdial ] && [ ! -d feeds/luci/applications/luci-app-syncdial ]; then
          mv tmp_luci/applications/luci-app-syncdial feeds/luci/applications
        fi

        if [ -d tmp_packages/net/vlmcsd ] && [ ! -d feeds/packages/net/vlmcsd ]; then
          mv tmp_packages/net/vlmcsd feeds/packages/net
        fi
        if [ -d tmp_luci/applications/luci-app-vlmcsd ] && [ ! -d feeds/luci/applications/luci-app-vlmcsd ]; then
          mv tmp_luci/applications/luci-app-vlmcsd feeds/luci/applications
        fi

        #[ ! -d feeds/packages/lang/lua-maxminddb ] && \
        #  git clone --branch master --depth 1 https://github.com/jerrykuku/lua-maxminddb.git feeds/packages/lang/lua-maxminddb || exit 1
        #[ ! -d feeds/luci/applications/luci-app-vssr ] && \
        #  git clone --branch master --depth 1 https://github.com/jerrykuku/luci-app-vssr.git feeds/luci/applications/luci-app-vssr || exit 1

        if [ -d tmp_luci/applications/luci-app-zerotier ] && [ ! -d feeds/luci/applications/luci-app-zerotier ]; then
          mv tmp_luci/applications/luci-app-zerotier feeds/luci/applications
        fi

        rm -rf tmp_oldpackages
        rm -rf tmp_newpackages
        rm -rf tmp_packages
        rm -rf tmp_luci

        ./scripts/feeds update -i packages
        ./scripts/feeds update -i luci
        sed -i "/iptables-nft/d" feeds/passwall2_luci/luci-app-passwall2/Makefile

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ ! -e openwrt/files/etc/openclash/core ] && mkdir -p openwrt/files/etc/openclash/core
        tunver=$(curl --fail -sL https://raw.githubusercontent.com/vernesong/OpenClash/core/master/core_version | sed -n 2p)
        curl --fail -sL https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64.tar.gz | tar -xz -C openwrt/files/etc/openclash/core && mv openwrt/files/etc/openclash/core/clash openwrt/files/etc/openclash/core/clash_meta
        #curl --fail -sL https://raw.githubusercontent.com/vernesong/OpenClash/core/master/premium/clash-linux-armv7-${tunver}.gz | gzip -d > openwrt/files/etc/openclash/core/clash_tun && chmod +x openwrt/files/etc/openclash/core/clash_tun
        #curl --fail -sL https://raw.githubusercontent.com/vernesong/OpenClash/core/master/dev/clash-linux-armv7.tar.gz | tar -xz -C openwrt/files/etc/openclash/core
        [ ! -e openwrt/files/usr/bin ] && mkdir -p openwrt/files/usr/bin
        #curl --fail -sL https://static.adguard.com/adguardhome/release/AdGuardHome_linux_armv7.tar.gz | tar -xz -C openwrt/files/usr/bin
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config || cat >> openwrt/.config <<EOF
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        # CONFIG_TARGET_ROOTFS_TARGZ is not set
        # CONFIG_TARGET_ROOTFS_EXT4FS is not set
        CONFIG_TARGET_ROOTFS_PARTSIZE=232
        # CONFIG_KERNEL_DEBUG_INFO is not set
        # CONFIG_FEED_passwall_packages is not set
        # CONFIG_FEED_passwall_luci is not set
        # CONFIG_FEED_passwall2_luci is not set
        # CONFIG_FEED_openclash_luci is not set
        # CONFIG_FEED_helloworld is not set
        CONFIG_PACKAGE_block-mount=y
        # CONFIG_PACKAGE_dnsmasq is not set
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_dnsmasq_full_ipset=y
        # CONFIG_PACKAGE_dnsmasq_full_nftset is not set
        CONFIG_PACKAGE_firewall=y
        # CONFIG_PACKAGE_firewall4 is not set
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_diffutils=y
        CONFIG_PACKAGE_kmod-fs-btrfs=y
        CONFIG_PACKAGE_kmod-fs-exfat=y
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-ntfs=y
        CONFIG_PACKAGE_kmod-fs-xfs=y
        CONFIG_PACKAGE_kmod-hwmon-coretemp=y
        CONFIG_PACKAGE_kmod-i2c-i801=y
        CONFIG_PACKAGE_kmod-hid=y
        CONFIG_PACKAGE_kmod-hid-generic=y
        CONFIG_PACKAGE_kmod-ipt-offload=y
        CONFIG_PACKAGE_kmod-nf-nathelper=y
        CONFIG_PACKAGE_kmod-nf-nathelper-extra=y
        # CONFIG_PACKAGE_kmod-nft-offload is not set
        CONFIG_PACKAGE_kmod-macvlan=y
        CONFIG_PACKAGE_kmod-vmxnet3=y
        CONFIG_PACKAGE_kmod-bonding=y
        CONFIG_PACKAGE_kmod-l2tp=y
        CONFIG_PACKAGE_kmod-sit=y
        CONFIG_PACKAGE_kmod-veth=y
        CONFIG_PACKAGE_kmod-vxlan=y
        CONFIG_PACKAGE_kmod-serial-8250=y
        CONFIG_PACKAGE_kmod-sound-core=y
        CONFIG_PACKAGE_kmod-usb-audio=y
        CONFIG_PACKAGE_kmod-usb-hid=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-ohci=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-ftdi=y
        CONFIG_PACKAGE_kmod-usb-serial-pl2303=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-extras=y
        CONFIG_PACKAGE_kmod-usb-uhci=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-ath10k=y
        CONFIG_PACKAGE_kmod-brcmfmac=y
        CONFIG_PACKAGE_kmod-mac80211=y
        CONFIG_LUA_ECO_OPENSSL=y
        # CONFIG_LUA_ECO_MBEDTLS is not set
        CONFIG_PACKAGE_libopenssl-legacy=y
        # CONFIG_LIBCURL_MBEDTLS is not set
        CONFIG_LIBCURL_OPENSSL=y
        # CONFIG_PACKAGE_libustream-mbedtls is not set
        CONFIG_PACKAGE_libustream-openssl=y
        CONFIG_PACKAGE_luci=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_PACKAGE_luci-app-ddns=y
        CONFIG_PACKAGE_luci-app-filemanager=y
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server is not set
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=y
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus is not set
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_tuic_client=y
        CONFIG_PACKAGE_luci-app-passwall2=y
        # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Libev_Client is not set
        CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client=y
        CONFIG_PACKAGE_luci-app-smartdns=y
        CONFIG_PACKAGE_luci-app-smartdns_INCLUDE_smartdns_ui=y
        CONFIG_PACKAGE_luci-app-sqm=y
        CONFIG_PACKAGE_luci-app-ssr-plus=y
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Server=y
        CONFIG_PACKAGE_luci-app-syncdial=y
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_luci-app-vlmcsd=y
        CONFIG_PACKAGE_luci-theme-openwrt-2020=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_ip6tables-mod-nat=y
        CONFIG_PACKAGE_ip6tables-zz-legacy=y
        CONFIG_PACKAGE_iptables-zz-legacy=y
        CONFIG_PACKAGE_miniupnpd-iptables=y
        # CONFIG_PACKAGE_miniupnpd-nftables is not set
        # CONFIG_PACKAGE_nftables-json is not set
        CONFIG_PACKAGE_openssh-sftp-server=y
        # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
        CONFIG_PACKAGE_wpad-openssl=y
        CONFIG_PACKAGE_ethtool=y
        CONFIG_SINGBOX_WITH_ACME=y
        CONFIG_SINGBOX_WITH_CLASH_API=y
        # CONFIG_SINGBOX_WITH_DHCP is not set
        CONFIG_SINGBOX_WITH_ECH=y
        # CONFIG_SINGBOX_WITH_EMBEDDED_TOR is not set
        # CONFIG_SINGBOX_WITH_GRPC is not set
        CONFIG_SINGBOX_WITH_GVISOR=y
        CONFIG_SINGBOX_WITH_QUIC=y
        CONFIG_SINGBOX_WITH_REALITY_SERVER=y
        CONFIG_SINGBOX_WITH_UTLS=y
        # CONFIG_SINGBOX_WITH_V2RAY_API is not set
        CONFIG_SINGBOX_WITH_WIREGUARD=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_vim=y
        CONFIG_PACKAGE_vim-runtime=y
        CONFIG_PACKAGE_screen=y
        CONFIG_PACKAGE_tmux=y
        CONFIG_PACKAGE_irqbalance=y
        CONFIG_PACKAGE_pciutils=y
        CONFIG_PACKAGE_sysstat=y
        CONFIG_PACKAGE_usbutils=y
        EOF
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        rm -rf dl/go-mod-cache dl/cargo
        rm -rf dl/smartdns*
        make download -j8
        New_PKG_MIRROR_HASH=$(sha256sum dl/$(sed -n 's/^PKG_NAME:=//p' feeds/packages/net/smartdns/Makefile | tr -d ' ')-$(sed -n 's/^PKG_VERSION:=//p' feeds/packages/net/smartdns/Makefile | tr -d ' ' )* | awk '{print $1}')
        New_MIRROR_HASH=$(sha256sum dl/smartdns-webui* | awk '{print $1}')
        echo "smartdns PKG_MIRROR_HASH: $New_PKG_MIRROR_HASH"
        echo "smartdns-webui MIRROR_HASH: $New_MIRROR_HASH"
        sed -i -e "/^PKG_MIRROR_HASH:=/cPKG_MIRROR_HASH:=$New_PKG_MIRROR_HASH" \
          -e $'/^\tMIRROR_HASH/c\\\tMIRROR_HASH:='"$New_MIRROR_HASH" \
          feeds/packages/net/smartdns/Makefile
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        env -u GITHUB_ACTIONS make -j$(nproc) || env -u GITHUB_ACTIONS make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -f *rootfs.img.gz
        rm -f *generic-kernel.bin
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${DEVICE_NAME}_${REPO_BRANCH}_$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
