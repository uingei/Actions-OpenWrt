name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        echo "[1/6] 获取当前安装的包列表（记录初始状态）..."
        dpkg-query -W -f='${Package}\n' | sort > current-packages.txt

        echo "[2/6] 写入 EFI 系统必要软件包列表..."
        cat > efi-essential.txt <<EOF
        grub-efi-amd64-signed
        shim-signed
        mokutil
        sbsigntool
        grub2-common
        efibootmgr
        os-prober
        linux-image-generic
        initramfs-tools
        init
        systemd-sysv
        udev
        libsystemd0
        util-linux
        base-files
        login
        passwd
        EOF

        echo "[3/6] 合并保留白名单..."
        cat minimal-packages.txt efi-essential.txt | sort -u > full-minimal-efi.txt

        echo "[4/6] 计算非白名单额外包..."
        comm -23 current-packages.txt full-minimal-efi.txt > extra-packages.raw.txt

        echo "[5/6] 过滤 Essential/held/关键依赖（如 libc6 等）..."
        egrep -v '^(init|systemd|dpkg|apt|libc6|perl-base|coreutils|bash|login|util-linux|base-files|libpam|libselinux|libcrypt|libsystemd|libudev|libmount|libtinfo|debconf|shim-signed|grub2-common|mokutil|grub-efi|linux-image|initramfs|efibootmgr|os-prober)' \
          extra-packages.raw.txt > extra-packages.safe.txt

        echo "[准备] 修复依赖 & 安装必要包..."
        sudo apt-get update
        sudo apt-get install -f -y || true
        sudo apt-get install -y grub-efi-amd64-signed grub2-common mokutil

        echo "[6/6] 使用 apt-get 非交互方式清理多余软件包..."
        while read -r pkg; do
          echo "准备卸载：$pkg"
          sudo apt-get purge -y "$pkg" || echo "[跳过失败] $pkg"
        done < extra-packages.safe.txt

        echo "[Done] 可选清理命令：sudo apt-get autoremove --purge -y && sudo apt-get clean"

        echo "[信息] 保存最终当前包列表..."
        dpkg-query -W -f='${Package}\n' | sort > new-current-packages.txt

    - name: Upload new package list
      uses: actions/upload-artifact@v4
      with:
        name: new-current-packages
        path: new-current-packages.txt
